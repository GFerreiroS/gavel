[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Let-chains (`if let ... && ...`) are used throughout and stabilised in 1.88.
# The old 1.85 claim here was wrong: the workspace never built on it, and the
# container build is where that surfaced.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

# Single source of truth for dependency versions.
[workspace.dependencies]
futures-core = "0.3"
# Wire codec for the coordinator <-> worker protocol. Chosen over JSON because
# these frames are the hot path between processes: postcard decodes without
# allocating and is roughly 10x more compact for these messages.
# The protocol runs between ordinary host processes. Disable Postcard's
# embedded/heapless defaults; the std codec is all this workspace uses.
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

anyhow = "1"
argon2 = "0.5"
askama = "0.14"
axum = "0.8"
getrandom = "0.3"
# The `Body` trait, for one call: the uncompressed size of a response, which
# the timing middleware reports. Already in the tree as one of axum's own
# dependencies; naming it here is what makes the trait importable.
http-body = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- internal ---
app-core = { path = "crates/app-core" }
app-integrations = { path = "crates/app-integrations" }
app-web = { path = "crates/app-web" }
cluster-core = { path = "crates/cluster-core" }
cluster-local = { path = "crates/cluster-local" }
storage = { path = "crates/storage" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
