# A single server, with the work spread over several processes.
#
#   docker compose up --build          one web process, three workers
#   docker compose up -d --scale worker=8
#
# The web container is the coordinator: it serves HTTP, owns the database and
# hands out tasks. The workers hold no state at all -- they dial in, are given
# an identity, take work, and are forgotten when they stop. That is why
# `--scale` works on them and would not work on the web container.

name: gavel

services:
  web:
    build: .
    command:
      - --host=0.0.0.0
      - --port=3000
      # Accept workers from the other containers.
      - --worker-listen=0.0.0.0:3001
      # None in-process: with separate worker containers, an in-process pool
      # would quietly do their work and make scaling look like it did nothing.
      - --workers=0
    environment:
      # Secrets are never flags. Put them in a .env beside this file; compose
      # substitutes them here and they stay out of the image and out of `ps`.
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID:-}
      BLIZZARD_CLIENT_SECRET: ${BLIZZARD_CLIENT_SECRET:-}
      # What a worker must present to join. Required whenever the worker port
      # is open: without it, anything that can reach 3001 becomes a node of
      # this cluster. Same value here and on every worker; the web container
      # refuses to start if it is missing.
      APP_CLUSTER_TOKEN: ${APP_CLUSTER_TOKEN:?set APP_CLUSTER_TOKEN in .env, e.g. openssl rand -hex 32}
      # Optional and one-shot. Public registration never grants admin; set
      # both for the first start, then remove them and recreate this container.
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_LOG: ${APP_LOG:-info,sqlx=warn}
      APP_SECURE_COOKIES: "true"
      APP_TRUST_PROXY_HEADERS: "true"
    volumes:
      - data:/data
    ports:
      # Only 3000, and only on the loopback: the reverse proxy is what faces
      # the network. 3001 is deliberately not published -- workers reach it on
      # the compose network, and nothing outside should.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      # `/healthz` answers without touching the database, so a slow query
      # cannot make a healthy process look dead.
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  worker:
    build: .
    command: ["--connect=web:3001"]
    environment:
      APP_CLUSTER_TOKEN: ${APP_CLUSTER_TOKEN:?set APP_CLUSTER_TOKEN in .env, e.g. openssl rand -hex 32}
      APP_LOG: ${APP_LOG:-info}
    depends_on:
      - web
    restart: unless-stopped
    # No ports, no volume, no database. A worker is pure compute; everything it
    # needs arrives over the connection it opens.
    deploy:
      replicas: 3

volumes:
  data:
