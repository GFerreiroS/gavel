# The data/web machine (docs/../CLAUDE.md §16, "Target deployment: one
# data/web machine and compute workers"). Runs on the Proxmox host that owns
# the SQLite file. --workers=0: once real worker machines exist, in-process
# workers would quietly do their work and make scaling look like it did
# nothing (the root compose.yml carries the same comment).
#
# No reverse proxy here. If ingress is a VPS running Nginx Proxy Manager (or
# any proxy) reaching this machine over Tailscale, that VPS is already doing
# TLS and the reverse-proxy job -- a second hop through a local proxy would
# just be the same job twice. Both published ports below bind to this VM's
# Tailscale address, which is also the private link the worker machines use;
# see deploy/README.md's networking section.
#
# Pulls a prebuilt image instead of `build: .` -- this machine never runs
# `cargo build`. .github/workflows/publish.yml builds it once, on push to
# main; Watchtower below is what notices and redeploys.
#
# Usage: see deploy/README.md.

name: gavel-web

services:
  web:
    image: ghcr.io/gferreiros/gavel:latest
    pull_policy: always
    command:
      - --host=0.0.0.0
      - --port=3000
      - --worker-listen=0.0.0.0:3001
      - --workers=0
    environment:
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID:?set BLIZZARD_CLIENT_ID in .env}
      BLIZZARD_CLIENT_SECRET: ${BLIZZARD_CLIENT_SECRET:?set BLIZZARD_CLIENT_SECRET in .env}
      # What a worker must present to join. Same value here and on every
      # worker machine's .env; this container refuses to start without it.
      APP_CLUSTER_TOKEN: ${APP_CLUSTER_TOKEN:?set APP_CLUSTER_TOKEN in .env, e.g. openssl rand -hex 32}
      # Optional and one-shot. Set both for the very first start only, confirm
      # the log line, then remove them from .env and `docker compose up -d`
      # again so the cleartext password does not sit in this container's
      # environment indefinitely.
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_LOG: ${APP_LOG:-info,sqlx=warn}
      APP_SECURE_COOKIES: "true"
      # Trustworthy here because the only thing that can reach :3000 at all
      # is whatever holds the Tailscale key for this tailnet -- see the
      # TAILSCALE_ADDR bind below.
      APP_TRUST_PROXY_HEADERS: "true"
      APP_MARKET_REGIONS: ${APP_MARKET_REGIONS:-eu}
    volumes:
      - data:/data
    ports:
      # Both ports bind to this VM's Tailscale IP, never 0.0.0.0 or a public
      # interface. That is what keeps :3000 reachable only from the ingress
      # VPS and :3001 reachable only from a worker machine, both of which
      # have to hold a key for this tailnet to reach either -- a stronger
      # bar than a firewall rule on a shared L2 network. Five bytes on :3001
      # with no token was, before APP_CLUSTER_TOKEN existed, the whole of
      # joining the cluster and taking work (README §10); the token is a
      # second lock, not a substitute for keeping the port off the public
      # side in the first place.
      - "${TAILSCALE_ADDR:?set TAILSCALE_ADDR in .env to this VM's tailscale0 IP}:3000:3000"
      - "${TAILSCALE_ADDR:?set TAILSCALE_ADDR in .env to this VM's tailscale0 IP}:3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Polls GHCR for a newer digest of whatever image tag the labelled
  # container above is running and redeploys it in place, same config, new
  # image -- this is "if there is a new commit on main, update yourselves"
  # for this machine. WATCHTOWER_LABEL_ENABLE means it only ever touches a
  # container carrying the enable label (web, not itself), which matters if
  # this host ever runs anything else.
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
    restart: unless-stopped

volumes:
  data:
