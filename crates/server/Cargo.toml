[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "server"

# Composition root. The only crate that knows every concrete implementation:
# SQLite for storage, Tokio tasks for the cluster, Raider.IO for characters.
# Swapping any of them is a change here and nowhere else.

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
app-core = { workspace = true }
app-integrations = { workspace = true }
app-web = { workspace = true }
cluster-core = { workspace = true, features = ["std"] }
cluster-local = { workspace = true }
storage = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
