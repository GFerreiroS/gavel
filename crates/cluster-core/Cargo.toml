[package]
name = "cluster-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The domain model of the work cluster: ids, jobs, tasks, events, workers,
# scheduling policy, and the coordinator <-> worker protocol.
#
# It contains *concepts only* -- no I/O, no sockets, no Tokio, no clock. That
# is what keeps the scheduler and the job state machine unit-testable without
# standing up a runtime, and what lets the same model be driven by an
# in-process worker pool or by workers on other machines.

[dependencies]
futures-core = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Test-only: the schedulers are async, so the unit tests need an executor.
tokio = { workspace = true, features = ["rt", "macros"] }
