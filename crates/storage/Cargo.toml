[package]
name = "storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Storage ADAPTERS.
#
# This crate implements the ports declared in `app-core::repo` on top of
# SQLite. It is the only crate in the workspace allowed to name SQLx. Swapping
# SQLite for NVS/LittleFS/replicated cluster storage means adding a sibling
# module here, not touching app-core or app-web.

[dependencies]
app-core = { workspace = true }
cluster-core = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
cluster-core = { workspace = true, features = ["std"] }
