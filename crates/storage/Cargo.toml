[package]
name = "storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Storage ADAPTERS.
#
# This crate implements the ports declared in `app-core::repo` on top of
# SQLite. It is the only crate in the workspace allowed to name SQLx. Swapping
# SQLite for another database means adding a sibling module here, not touching
# app-core or app-web.

[dependencies]
app-core = { workspace = true }
cluster-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }

[features]
# Exposes `SqliteStore::pool` so an integration test can hold a hand-written
# query against what a port returns. Never enabled by the server.
test-pool = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
postcard = { workspace = true }
cluster-core = { workspace = true }
storage = { path = ".", features = ["test-pool"] }
