{% extends "base.html" %}
{% block content %}
<h1>{{ "Dashboard"|t }}</h1>

<div id="stats" hx-get="/partials/stats" hx-trigger="cluster-changed from:body" hx-swap="innerHTML">
  {% include "partials/stats.html" %}
</div>

<article>
  <h2>{{ "Request metrics"|t }}</h2>
  <div id="metrics" hx-get="/partials/metrics"
       hx-trigger="cluster-changed from:body"
       hx-swap="innerHTML">
    {% include "partials/metrics.html" %}
  </div>
</article>

<article>
  <h2>{{ "Recent cluster events"|t }}</h2>
  <div id="events" hx-get="/partials/events" hx-trigger="cluster-changed from:body" hx-swap="innerHTML">
    {% include "partials/events.html" %}
  </div>
</article>
{% endblock %}
