{% extends "base.html" %}
{% block content %}
<h1>{{ "World of Warcraft"|t }}</h1>
<p class="hint">
  {{ "One vertical slice: look up a character, normalise the upstream response into our own model, cache it briefly, render it."|t }}
</p>

<article>
  <form class="toolbar" hx-get="/wow/character"
        hx-target="#character"
        hx-swap="innerHTML"
        hx-indicator="#character-loading">
    <label>{{ "Region"|t }}
      <select name="region">
        <option value="eu">EU</option>
        <option value="us">US</option>
        <option value="kr">KR</option>
        <option value="tw">TW</option>
      </select>
    </label>
    <label>{{ "Realm"|t }} <input type="text" name="realm" placeholder="Silvermoon" required></label>
    <label>{{ "Character"|t }} <input type="text" name="name" placeholder='{{ "Name"|t }}' required></label>
    <button type="submit">{{ "Search"|t }}</button>
  </form>
  <span id="character-loading" class="htmx-indicator">{{ "searching…"|t }}</span>
</article>

<div id="character">
  <p class="muted">{{ "No character loaded yet."|t }}</p>
</div>
{% endblock %}
