[package]
name = "cluster-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The host implementation of the cluster runtime: one Tokio task per in-process
# node, one supervisor task holding cluster state.
#
# It depends on `cluster-core` and nothing else in the workspace. It knows
# nothing about HTTP, SQLite, users or WoW. Another runtime means writing
# another implementor of `ClusterControl`.

[dependencies]
cluster-core = { workspace = true }
futures-core = { workspace = true }
# `net` and `io-util` are for the worker transport: worker processes connect
# over TCP, which an in-process pool never needed.
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true }
