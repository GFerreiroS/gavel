[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
# `cargo run` boots the firmware in the Espressif QEMU fork rather than
# flashing hardware, so the same command works with no board attached.
runner = "../scripts/qemu-run.sh"
rustflags = [
  "-C", "link-arg=-Tlinkall.x",
  "-C", "link-arg=-nostartfiles",
]

[unstable]
# There is no prebuilt core/alloc for xtensa-esp32s3-none-elf.
build-std = ["core", "alloc"]

[env]
ESP_LOG = "info"
